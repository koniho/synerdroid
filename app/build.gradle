plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.koniho.synerdroid'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.koniho.synerdroid'
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName '0.2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
