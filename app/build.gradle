plugins {
    id 'com.android.application'

}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'io.github.koniho.synerdroid'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.koniho.synerdroid'
        minSdk 24
        targetSdk 35
        versionCode 23
        versionName '0.3.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions { unitTests.returnDefaultValues = true }
}
